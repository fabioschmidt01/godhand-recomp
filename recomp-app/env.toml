# Caminhos usados pelo pipeline. Relativos são resolvidos a partir da raiz do projeto (pasta acima de recomp-app).
# Nenhuma variável de ambiente global é alterada: tudo é lido daqui.

iso = "God Hand (USA).iso"

[dirs]
work = "work"
mods = "mods"
out = "out"

[tools]
ps2recomp_src = "third_party/PS2Recomp"
ps2recomp_build = "work/build/ps2recomp"
ghidra = "C:/tools/ghidra_12.1.4_PUBLIC"
java_home = "C:/tools/jdk-21"
xdelta3 = "tools/xdelta3/xdelta3.exe"
pcsx2 = "G:/PCSX2 Emulador/pcsx2-qt.exe"
pcsx2_src = "refs/pcsx2"
mingw_bin = "C:/Users/User/ghost-tools/mingw/mingw64/bin"

[build]
jobs = 8                 # 16 GB de RAM: não subir muito
cxx_flags = "-msse4.1"
ccache_dir = "work/ccache"
