# Configuração versionada, com padrões portáveis. Caminhos relativos partem da raiz do projeto
# (a pasta acima de recomp-app). Caminhos específicos da sua máquina vão em env.local.toml, que
# tem o mesmo formato, sobrepõe este arquivo e não é versionado (veja env.local.example.toml).

iso = "God Hand (USA).iso"

[dirs]
work = "work"
patches = "patches"     # .xdelta e .pnach
mods = "mods"           # substituição de arquivos, uma pasta por mod
textures = "textures"   # pacotes de texturas
out = "out"

[tools]
ps2recomp_src = "third_party/PS2Recomp"
ps2recomp_build = "work/build/ps2recomp"
xdelta3 = "tools/xdelta3/xdelta3.exe"
mingw_bin = ""           # pasta bin do MinGW, se g++/cmake/ninja não estiverem no PATH

# Só para desenvolvimento (gerar mapas de funções, comparar com o emulador). Quem usa o app não precisa.
ghidra = ""
java_home = ""
pcsx2 = ""
pcsx2_src = "refs/pcsx2"

[build]
jobs = 8                 # compilações em paralelo; com 16 GB de RAM não subir muito
cxx_flags = "-msse4.1"
opt_level = "-O1"        # otimização do código gerado; -O2 demora bem mais para compilar
bucket_shift = 11        # cada unidade de compilação reúne as funções de uma faixa de 2^11 = 2 KB
ccache_dir = "work/ccache"
