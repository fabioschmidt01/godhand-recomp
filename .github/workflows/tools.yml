name: tools

# Compila o PS2Recomp (recompilador, analisador, runtime) com MSVC e roda os testes.
# Em tags vX.Y.Z publica os executáveis como release.
on:
  push:
    branches: [main]
    paths:
      - "third_party/PS2Recomp/**"
      - ".github/workflows/tools.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "third_party/PS2Recomp/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        run: cmake -S third_party/PS2Recomp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2X_BUILD_STUDIO=OFF

      - name: Build
        run: cmake --build build

      - name: Tests
        working-directory: third_party/PS2Recomp
        run: ..\..\build\ps2xTest\ps2x_tests.exe

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ps2xRecomp/ps2_recomp.exe, build/ps2xAnalyzer/ps2_analyzer.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ps2recomp-tools-windows-msvc
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/*.exe -DestinationPath "ps2recomp-tools-${{ github.ref_name }}-windows-msvc.zip"
          gh release create "${{ github.ref_name }}" "ps2recomp-tools-${{ github.ref_name }}-windows-msvc.zip" --title "${{ github.ref_name }}" --notes "Ver CHANGELOG.md." --verify-tag
