name: guard

# Roda em todo push: falha se algum arquivo do jogo (ISO, dados do disco, BIOS) ou patch
# (xdelta, pnach) estiver versionado. O .gitignore em lista branca é a primeira barreira; esta é a segunda.
on:
  push:
  pull_request:

jobs:
  no-game-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Nenhum arquivo do jogo ou patch no repositório
        run: |
          bad=$(git ls-files | grep -iE '\.(iso|bin\.cue|cue|afs|afd|ims|xdelta|pnach|ips|bps|ppf|rom0|rom1|nvm|mec|erom|ps2|sfd)$|(^|/)(bios|work|refs|out)/|(^|/)S[CL][UEP][SM]_[0-9]{3}\.[0-9]{2}$' || true)
          if [ -n "$bad" ]; then
            echo "Arquivos proibidos versionados:"
            echo "$bad"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 20000000')
          if [ -n "$big" ]; then
            echo "Arquivos acima de 20 MB (suspeito):"
            echo "$big"
            exit 1
          fi
          echo "ok: $(git ls-files | wc -l) arquivos versionados, nenhum proibido"
