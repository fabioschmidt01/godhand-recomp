name: app

# Verifica a aplicação (núcleo, CLI e GUI) a cada mudança em recomp-app.
on:
  push:
    branches: [main]
    paths:
      - "recomp-app/**"
      - "mods/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "recomp-app/**"
      - "mods/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: recomp-app
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            recomp-app
            mods

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Compila os módulos
        run: python -m compileall -q recomp

      - name: Testes (núcleo e GUI off-screen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: CLI
        run: |
          python -m recomp --version
          python -m recomp mods
